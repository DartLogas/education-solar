<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Солнечная система — интерактивная карта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --panel:rgba(10,14,28,.68);
  --panel2:rgba(255,255,255,.045);
  --line:rgba(170,190,255,.13);
  --txt:#e9edf8;
  --mut:#8f9bbb;
  --acc:#ffc86b;
  --acc2:#7fd0ff;
  --navw:212px;
  --infow:350px;
  --barh:56px; --skybarh:56px;
  --barcx:calc(244px + (100vw - 244px)/2); --barinset:244px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#02030a;color:var(--txt);
  font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
canvas#space{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#space.drag{cursor:grabbing}
canvas#space.hover{cursor:pointer}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:0 10px 40px rgba(0,0,0,.35)}
button{font:inherit;color:inherit}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px;
  cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:rgba(255,255,255,.1);border-color:rgba(170,190,255,.3)}
.btn.on{background:rgba(255,200,107,.15);border-color:rgba(255,200,107,.55);color:#ffdca0}
.btn.icon{padding:7px 10px;min-width:34px}

/* header */
#hdr{position:fixed;left:16px;top:16px;padding:6px;z-index:8;display:flex;gap:6px;align-items:center}
.appnav{display:flex;gap:4px;padding:3px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.an-tab{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:9px 15px;background:none;color:#a9b4d2;cursor:pointer;
  font-family:Unbounded,Manrope,sans-serif;font-size:12.5px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.an-tab svg{width:18px;height:18px;flex:none}
.an-tab:hover{color:#fff;background:rgba(255,255,255,.07)}
.an-tab.on[data-sec=system]{background:linear-gradient(135deg,rgba(255,200,107,.30),rgba(255,140,60,.12));color:#ffe3aa;box-shadow:inset 0 0 0 1px rgba(255,200,107,.5),0 0 18px rgba(255,170,80,.18)}
.an-tab.on[data-sec=sky]{background:linear-gradient(135deg,rgba(127,208,255,.30),rgba(100,120,255,.14));color:#d8f0ff;box-shadow:inset 0 0 0 1px rgba(127,208,255,.55),0 0 18px rgba(110,170,255,.2)}
.an-tab:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#navToggle{display:none}

/* nav */
#nav{position:fixed;left:16px;top:82px;width:var(--navw);bottom:196px;overflow:auto;padding:8px;z-index:5}
.ng-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);padding:10px 8px 5px}
.nv{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:9px;
  padding:6px 8px;font-size:13.5px;cursor:pointer;color:#dfe5f5}
.nv:hover{background:rgba(255,255,255,.07)}
.nv.sel{background:rgba(255,200,107,.14);color:#ffe0a8}
.nv i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.nv.sub{font-size:12.5px;padding:4px 8px 4px 27px;color:#b9c2da}
.nv.sub i{width:7px;height:7px}
.nv kbd{margin-left:auto;font:10px Manrope,sans-serif;color:#66708c;border:1px solid #2a3350;border-radius:4px;padding:0 4px}

/* toggles */
#toggles{position:fixed;left:16px;bottom:104px;width:var(--navw);padding:9px 10px;z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:6px}
#toggles .btn{font-size:12px;padding:6px 8px;text-align:left}
#toggles .btn::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;border:1px solid #7b86a6;vertical-align:0}
#toggles .btn.on::before{background:var(--acc);border-color:var(--acc)}

/* scale bar */
#scale{position:fixed;left:16px;bottom:16px;z-index:5;font-size:11.5px;color:#c6cee4;pointer-events:none;width:var(--navw)}
#scaleBar{height:6px;border:1.5px solid #c6cee4;border-top:0;margin-bottom:4px;width:100px}
#scaleTxt b{color:#fff;font-weight:600}
#scaleNote{color:var(--mut);font-size:10.5px;margin-top:2px}

/* bottom bar */
#bar{position:fixed;bottom:16px;left:var(--barcx);transform:translateX(-50%);width:max-content;max-width:calc(100vw - var(--barinset) - 16px);
  z-index:6;display:flex;align-items:center;gap:8px 14px;padding:8px 10px;flex-wrap:wrap;justify-content:center}
.grp{display:flex;align-items:center;gap:6px;flex:none}
.btn.icon{width:36px;min-width:0;padding:7px 0;text-align:center;flex:none}
.sm{display:none}
.sky-btn{border-color:rgba(127,208,255,.45);color:#cfeaff}
#date{width:186px;flex:none;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
#date .d1{font-family:Unbounded,Manrope,sans-serif;font-size:12.5px;letter-spacing:.01em}
#date small{display:block;font-family:Manrope,sans-serif;color:var(--mut);font-size:10.5px;letter-spacing:0;font-variant-numeric:tabular-nums}
#spd{font-size:12px;color:#cfd6ea;width:104px;flex:none;text-align:center;white-space:nowrap}

/* info panel */
#info{position:fixed;right:16px;top:16px;bottom:calc(var(--barh) + 28px);width:var(--infow);z-index:7;overflow:auto;padding:18px 18px 16px;
  transform:translateX(calc(100% + 30px));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#info.open{transform:none}
#info::-webkit-scrollbar,#nav::-webkit-scrollbar{width:8px}
#info::-webkit-scrollbar-thumb,#nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
.ip-head{display:flex;gap:14px;align-items:center}
#ipCanvas{width:96px;height:96px;flex:none}
.ip-type{font-size:11px;color:var(--acc2);text-transform:uppercase;letter-spacing:.08em}
.ip-head h2{font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:23px;margin:4px 0 2px}
.ip-en{color:var(--mut);font-size:12.5px}
#ipClose{position:absolute;right:12px;top:12px}
.ip-desc{font-size:14px;line-height:1.55;color:#d5dbec;margin:14px 0 10px}
.ip-fact{font-size:13px;line-height:1.5;background:linear-gradient(135deg,rgba(255,200,107,.12),rgba(255,200,107,.03));
  border:1px solid rgba(255,200,107,.22);border-radius:12px;padding:10px 12px;color:#f1e3c6}
.ip-fact b{color:var(--acc)}
#info h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin:18px 0 8px;font-weight:600}
.stats{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.stats .k{color:var(--mut)}
.stats .v{text-align:right;color:#eef1fa}
.live{background:rgba(127,208,255,.07);border:1px solid rgba(127,208,255,.2);border-radius:12px;padding:10px 12px;margin-top:12px}
.live .k{color:#9cc7e4}
.live .cap{grid-column:1/-1;font-size:11px;color:#7d93ad;margin-top:2px}
.note{font-size:12px;color:#9aa6c4;line-height:1.5;margin-top:8px}
.note i{font-style:normal;color:var(--acc)}
#ipCmp{width:100%;height:120px;display:block;background:rgba(255,255,255,.03);border-radius:12px;border:1px solid var(--line)}
#ipCmpTxt{font-size:12.5px;color:#c9d1e6;margin-top:7px;line-height:1.45}
.ip-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.chip:hover{border-color:rgba(255,200,107,.5)}

/* hint */
#hint{position:fixed;bottom:calc(var(--barh) + 30px);left:var(--barcx);transform:translateX(-50%);z-index:8;padding:9px 16px;font-size:12.5px;color:#cfd7ec;
  transition:opacity .8s;white-space:nowrap}
#hint b{color:var(--acc)}

/* compare modal */
#cmp{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 30% 40%,#0c1226 0%,#03040b 70%);display:none}
#cmp.open{display:block}
#cmpCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.cmp-top{position:absolute;left:16px;right:16px;top:16px;display:flex;gap:14px;align-items:center;padding:12px 16px;z-index:2;flex-wrap:wrap}
.cmp-top h2{font-family:Unbounded,Manrope,sans-serif;font-size:17px;margin:0;font-weight:600}
.cmp-top p{margin:3px 0 0;font-size:12px;color:var(--mut)}
.cmp-top .grow{flex:1;min-width:200px}
#cmpScale{position:absolute;left:16px;bottom:16px;padding:8px 12px;font-size:12px;color:#c6cee4;z-index:2}

/* ---------- responsive: medium (tablets, small laptops) ---------- */
@media (max-width:1100px){
  :root{--barcx:50vw; --barinset:0px; --infow:320px}
  #navToggle{display:block}
  #nav{display:none;z-index:9;bottom:auto;max-height:calc(100vh - var(--barh) - 130px)}
  #nav.show{display:block}
  #toggles{bottom:calc(var(--barh) + 92px)}
  #scale{bottom:calc(var(--barh) + 26px)}
}
/* ---------- responsive: phones ---------- */
@media (max-width:820px){
  :root{--infow:auto}
  #hdr{right:12px;left:12px;top:12px;padding:5px}
  #hdr .appnav{flex:1} .an-tab{flex:1;padding:9px 8px}
  #toggles{left:12px;right:12px;top:72px;bottom:auto;width:auto;grid-template-columns:repeat(4,1fr);padding:5px;gap:4px}
  #toggles .btn{font-size:11px;padding:5px 4px;text-align:center}
  #toggles .btn::before{margin-right:4px}
  #nav{top:118px;left:12px;width:240px;max-height:calc(100vh - var(--barh) - 140px)}
  #scale{left:12px;right:12px;width:auto;bottom:calc(var(--barh) + 22px)}
  #bar{left:8px;right:8px;transform:none;width:auto;max-width:none;bottom:8px;padding:6px;gap:6px;flex-direction:column;align-items:stretch}
  .grp{min-width:0;width:100%}
  .grp-time{justify-content:space-between}
  #date{width:0;flex:1 1 0;min-width:0;text-align:left;padding-left:4px}
  #spd{width:84px;font-size:11px}
  .grp-view{overflow-x:auto;scrollbar-width:none;justify-content:flex-start}
  .grp-view::-webkit-scrollbar{display:none}
  .grp-view .seg button{padding:6px 10px;font-size:12px}
  .grp-view .btn{font-size:12px;padding:6px 10px}
  .lg{display:none} .sm{display:inline}
  #info{left:8px;right:8px;top:auto;width:auto;bottom:calc(var(--barh) + 16px);max-height:min(46vh, calc(100vh - var(--barh) - 250px));transform:translateY(calc(100% + var(--barh) + 40px))}
  #info.open{transform:none}
  #hint{display:none}
  .cmp-top{left:8px;right:8px;top:8px;padding:10px 12px;gap:8px}
  .cmp-top p{display:none}
}
@media (max-width:560px){
  .grp-time{flex-wrap:wrap;justify-content:center;row-gap:4px}
  #date{flex:1 1 100%;width:auto;text-align:center;padding:2px 0 0}
  #date small{display:inline;margin-left:6px}
}
@media (max-width:380px){
  #today{padding:6px 8px;font-size:12px}
  #spd{width:72px}
}
/* ---------- responsive: phones in landscape (low height) ---------- */
@media (max-height:520px) and (min-width:560px){
  #hdr{left:8px;top:6px;padding:4px}
  .an-tab{padding:7px 10px;font-size:11.5px}
  #navToggle{display:block}
  #nav{top:56px;left:12px;bottom:auto;max-height:calc(100vh - var(--barh) - 80px)}
  #toggles{top:8px;bottom:auto;left:auto;right:12px;width:auto;grid-template-columns:repeat(4,auto);padding:4px;gap:4px}
  #toggles .btn{font-size:11px;padding:4px 6px}
  #scale{display:none}
  #bar{left:8px;right:8px;transform:none;width:auto;max-width:none;bottom:6px;padding:5px;gap:6px;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start}
  #bar::-webkit-scrollbar{display:none}
  #date{width:150px} #date .d1{font-size:11.5px}
  .lg{display:none} .sm{display:inline}
  #info{left:auto;right:8px;top:8px;width:min(330px,45vw);max-height:none;bottom:calc(var(--barh) + 14px);transform:translateX(calc(100% + 30px))}
  #info.open{transform:none}
  #hint{display:none}
  .cmp-top p{display:none}
}

/* ===== sky ===== */
#sky{position:fixed;inset:0;z-index:30;display:none;background:#02030a}
#sky.open{display:block}
#skyCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#skyCanvas.drag{cursor:grabbing} #skyCanvas.hover{cursor:pointer}
.sky-top{position:absolute;left:16px;right:16px;top:16px;display:flex;gap:12px;align-items:center;padding:6px 10px 6px 6px;z-index:3;flex-wrap:wrap}
.sky-sub{flex:1;min-width:160px;margin:0 !important;font-size:12px;color:var(--mut);line-height:1.35;order:3}
.sky-top .appnav{order:1} #skyListBtn{order:2} #skyMode{order:4} #skyCity{order:5}
.sky-top h2{font-family:Unbounded,Manrope,sans-serif;font-size:17px;margin:0;font-weight:600;
  background:linear-gradient(90deg,#cfe4ff,#9fd8ff 50%,#ffd38a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sky-top p{margin:3px 0 0;font-size:12px;color:var(--mut)}
.sky-top .grow{flex:1;min-width:180px}
#skyListBtn{display:none}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}
.seg{flex:none}
.seg button{background:none;border:0;padding:7px 12px;font-size:13px;cursor:pointer;color:#cbd3ea;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:rgba(255,200,107,.16);color:#ffdca0}
#skyCity{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font:inherit;font-size:13px}
#skyCity option{background:#0d1222}
#skyList{position:absolute;left:16px;top:84px;bottom:16px;width:258px;padding:10px;z-index:3;display:flex;flex-direction:column}
#skySearch{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--txt);font:inherit;font-size:13px;outline:none}
#skySearch:focus{border-color:rgba(255,200,107,.5)}
.tabs{display:flex;gap:4px;margin:8px 0 6px}
.tab{flex:1;font-size:11.5px;padding:5px 2px;border-radius:8px;border:1px solid transparent;background:none;color:#aeb8d4;cursor:pointer}
.tab:hover{background:rgba(255,255,255,.06)} .tab.on{border-color:rgba(255,200,107,.45);color:#ffdca0;background:rgba(255,200,107,.1)}
#skyItems{overflow:auto;flex:1 1 auto;min-height:110px;margin:0 -4px;padding:0 4px}
#skyItems::-webkit-scrollbar,#skyInfo::-webkit-scrollbar{width:8px}
#skyItems::-webkit-scrollbar-thumb,#skyInfo::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
.si{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:5px 8px;cursor:pointer;color:#dfe5f5;font-size:13px}
.si:hover{background:rgba(255,255,255,.07)} .si.sel{background:rgba(255,200,107,.14);color:#ffe0a8}
.si small{margin-left:auto;color:#6f7a98;font-size:11px;white-space:nowrap}
.si .ic{width:14px;text-align:center;color:#8fb6ea;flex:none}
.si.below{opacity:.5}
.sgh{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);padding:8px 8px 3px}
#skyOpts{display:grid;grid-template-columns:1fr 1fr;gap:5px;border-top:1px solid var(--line);padding-top:9px;margin-top:6px}
#skyOpts .btn{font-size:11.5px;padding:5px 7px;text-align:left}
#skyOpts .btn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;border:1px solid #7b86a6}
#skyOpts .btn.on::before{background:var(--acc);border-color:var(--acc)}
#skyInfo{position:absolute;right:16px;top:84px;bottom:calc(var(--skybarh) + 28px);width:340px;z-index:3;overflow:auto;padding:16px 18px;
  transform:translateX(calc(100% + 30px));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#skyInfo.open{transform:none}
#skyInfo h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin:16px 0 8px;font-weight:600}
#skyInfo .ip-head h2{font-size:22px}
#skyInfo .lat{color:var(--mut);font-size:12.5px;margin-top:2px}
#skyInfo .xbtn{position:absolute;right:12px;top:12px}
#skyInfo .stats{grid-template-columns:44% 1fr}
#skyBar{position:absolute;bottom:16px;left:calc(290px + (100vw - 290px)/2);transform:translateX(-50%);width:max-content;max-width:calc(100vw - 306px);
  display:flex;align-items:center;gap:6px;padding:8px 10px;z-index:4;flex-wrap:wrap;justify-content:center}
#skyTime{width:212px;flex:none;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
#skyTime .d1{font-family:Manrope,sans-serif;font-weight:700;font-size:13.5px}
#skySpeed{width:122px;flex:none;text-align:center}
.grp-ctl{gap:5px} .grp-tm{gap:8px}
#skyTime small{display:block;font-family:Manrope,sans-serif;font-size:10.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
#skyBar .btn{font-size:12.5px;padding:6px 9px}
#skyDay{position:absolute;top:94px;left:50%;transform:translateX(-50%);z-index:3;padding:8px 14px;font-size:12.5px;color:#e6eefc;display:none;max-width:min(560px,calc(100vw - 32px));text-align:center}
#skyDay button{margin-left:8px}
#skyTip{position:absolute;pointer-events:none;padding:6px 10px;font-size:12px;border-radius:9px;background:rgba(10,14,28,.88);
  border:1px solid var(--line);display:none;white-space:nowrap;z-index:6;color:#e9edf8}
#skyTip b{color:#ffd690}
#skyCity{order:5} .sky-top .fs-btn{order:7}
.fs-btn{font-size:15px;line-height:1}
#arFab{position:absolute;right:18px;bottom:calc(var(--skybarh) + 30px);z-index:5;display:flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;
  border-radius:18px;border:1px solid rgba(150,215,255,.6);cursor:pointer;color:#fff;text-align:left;
  background:linear-gradient(135deg,rgba(64,150,255,.92),rgba(124,84,255,.9));box-shadow:0 8px 30px rgba(70,120,255,.45),inset 0 1px 0 rgba(255,255,255,.35);
  animation:fabGlow 2.6s ease-in-out infinite}
#arFab:hover{filter:brightness(1.08)}
#arFab .fab-ic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
#arFab svg{width:28px;height:28px}
#arFab b{display:block;font-family:Unbounded,Manrope,sans-serif;font-size:13.5px;font-weight:600;letter-spacing:.01em}
#arFab small{display:block;font-size:11.5px;opacity:.85;margin-top:2px}
@keyframes fabGlow{0%,100%{box-shadow:0 8px 30px rgba(70,120,255,.45),inset 0 1px 0 rgba(255,255,255,.35)}50%{box-shadow:0 8px 42px rgba(120,110,255,.75),inset 0 1px 0 rgba(255,255,255,.35)}}
#sky.ar #arFab{display:none}
#arCamState{display:none}
#sky.ar #arCamState{display:block;position:absolute;left:50%;transform:translateX(-50%);top:74px;z-index:6;padding:6px 12px;font-size:12px;color:#ffd9c9;max-width:calc(100vw - 24px);text-align:center}
#sky.ar #arCamState:empty{display:none}
#sky.ar #arCamState{width:min(420px,calc(100vw - 24px));line-height:1.4}
#arCamState .cs-row{display:flex;gap:8px;justify-content:center;margin-top:6px}
@media (max-width:820px){
  #arFab{right:auto;left:50%;transform:translateX(-50%);bottom:calc(var(--skybarh) + 16px);padding:8px 16px 8px 8px;white-space:nowrap}
  #arFab .fab-ic{width:36px;height:36px} #arFab svg{width:24px;height:24px}
  #skyInfo.open ~ #arFab{display:none}
}
@media (max-height:520px) and (min-width:560px){

function visRange(b){

  const det=st.P11*st.P22-st.P12*st.P21; if (Math.abs(det)<1e-4) return {E0:0,d:Math.PI,N:900};
  const vx=cam.x-o.x, vy=cam.y-o.y;

    if (b.parent && !moonVisible(b)) continue;
    if (b.st.a*S < 2.5) continue;
    const isSel = selected===b, isHov = hoverId===b.id;
    const base = b.type==='planet'?0.24 : b.type==='moon'?0.22 : 0.17;

    ctx.strokeStyle = rgba(b.rgb, isSel?0.8:isHov?0.5:base);
    if (b.type==='dwarf'||b.type==='comet') ctx.setLineDash(isSel?[]:[4,5]);
    pathArc(b, rng.E0-rng.d, rng.E0+rng.d, rng.N); ctx.stroke();
    ctx.setLineDash([]);
    // trail behind the body
    const bx=SX(b.x), by=SY(b.y), diag=Math.hypot(W,H);
    if (rng.d<Math.PI && (Math.abs(bx-cx)>3*diag || Math.abs(by-cy)>3*diag)) continue;

const easeS=t=>0.5-0.5*Math.cos(Math.PI*t), smooth5=t=>t*t*t*(t*(t*6-15)+10);
function focusL(b){
  const a=avail(), k = b.rings?0.07 : b.id==='sun'?0.16 : 0.14;
  return clamp(Math.log(k*Math.min(a.w,a.h)/(b.R/AU)), LMIN(), LMAX);
}
function flyTo(target, l1, dur){
  const tx=target.x, ty=target.y, dist=Math.hypot(tx-cam.x, ty-cam.y), a=avail();
  const lfit=Math.log(0.6*Math.min(a.w,a.h)/Math.max(dist,1e-12));
  const mid=Math.min((cam.l+l1)/2, lfit), lc=2*mid-0.5*(cam.l+l1);
  const span=Math.abs(cam.l-mid)+Math.abs(l1-mid);
  fly={t0:performance.now(), dur:dur||clamp(1000+span*150,900,3400), x0:cam.x, y0:cam.y, l0:cam.l, l1, lc, target};
  zoomT=null;
}
function selectBody(b, doFly=true, l=null){
  selected=b; follow=b?b.id:null;
  document.querySelectorAll('.nv').forEach(n=>n.classList.toggle('sel', b && n.dataset.id===b.id));
  if (b){ buildInfo(b); document.getElementById('info').classList.add('open'); if (doFly) flyTo(b, l!=null?l:focusL(b)); }
  else document.getElementById('info').classList.remove('open');
  if (MQ_MID.matches || MQ_LAND.matches) document.getElementById('nav').classList.remove('show');
}
function preset(name){
  selectBody(null); follow=null;
  const au={inner:1.75, planets:31.5, far:100}[name];
  flyTo({x:0,y:0}, fitL(au));
}
function updateCamera(now, dt){
  if (fly){
    let t=(now-fly.t0)/fly.dur; if (t>1) t=1;
    const u=smooth5(clamp((t-0.12)/0.55,0,1)), v=easeS(t);
    const tx=fly.target.x, ty=fly.target.y;
    cam.x=fly.x0+(tx-fly.x0)*u; cam.y=fly.y0+(ty-fly.y0)*u;
    cam.l=(1-v)*(1-v)*fly.l0 + 2*v*(1-v)*fly.lc + v*v*fly.l1;
    if (t>=1) fly=null;
  } else {
    if (follow){ const b=BY[follow]; cam.x=b.x; cam.y=b.y; }
    if (zoomT!=null){
      const k=1-Math.exp(-dt*14); let before=null;
      if (zoomAnchor && !follow) before={wx:cam.x+(zoomAnchor.x-cx)/S, wy:cam.y-(zoomAnchor.y-cy)/S};
      cam.l += (zoomT-cam.l)*k;
      if (before){ const S2=Math.exp(cam.l); cam.x=before.wx-(zoomAnchor.x-cx)/S2; cam.y=before.wy+(zoomAnchor.y-cy)/S2; }
      if (Math.abs(zoomT-cam.l)<1e-4){ cam.l=zoomT; zoomT=null; }
    }
  }
  S=Math.exp(cam.l); const c=viewCenter(); cx=c.x; cy=c.y;
  let dx=(cam.x-prevCam.x)*S, dy=(cam.y-prevCam.y)*S;
  bgOff.x -= clamp(dx,-30,30)*0.04; bgOff.y += clamp(dy,-30,30)*0.04;
  prevCam.x=cam.x; prevCam.y=cam.y;
}

const elDate=document.getElementById('date'), elScaleBar=document.getElementById('scaleBar'), elScaleTxt=document.getElementById('scaleTxt'), elScaleNote=document.getElementById('scaleNote');
let lastHud='';
function hud(){
  const d=jdToDate(simD+J2000);
  const ds = isFinite(d) ? d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}) : '—';
  const tzh = -d.getTimezoneOffset()/60, tzs = 'UTC' + (tzh>=0?'+':'−') + nf(Math.abs(tzh),1);
  const sp = SPEEDS[spIdx][0]>=1/24 ? '' : pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ' (' + tzs + ') · ';
  const target=110/S*AU; const p=Math.pow(10,Math.floor(Math.log10(target))); let nice=p;
  for (const m of [1,2,5,10]) if (m*p<=target) nice=m*p;
  const px=nice/AU*S;
  const lab = nice>=AU*0.1 ? fmtAU(nice/AU) : fmtDist(nice);
  const lt = fmtLight(nice/C_KM);
  let note='';
  const fb = follow ? BY[follow] : null;
  if (fb){ const {real}=displayR(fb); note = real>=fb.icon ? `${fb.name}: размер в реальном масштабе` : 'Тела показаны значками — приблизьте, чтобы увидеть реальный размер'; }
  else note = S*BY.earth.R/AU < BY.earth.icon ? 'Планеты показаны значками, не в масштабе' : '';
  const key=ds+sp+'|'+px.toFixed(1)+lab+note+(playing?1:0);
  if (key===lastHud) return; lastHud=key;
  elDate.innerHTML = '<span class="d1">' + ds + '</span><small>' + sp + (playing ? (dir<0?'время идёт назад':'дата модели') : 'пауза') + '</small>';
  elScaleBar.style.width=px.toFixed(1)+'px';
  elScaleTxt.innerHTML = `<b>${lab}</b> · свет проходит за ${lt}`;
  elScaleNote.textContent = note;
}

const FS = {
  el: document.documentElement,
  supported(){ const e=this.el; return !!((e.requestFullscreen||e.webkitRequestFullscreen) && (document.fullscreenEnabled||document.webkitFullscreenEnabled)); },
  active(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); },
  enter(){ const e=this.el, f=e.requestFullscreen||e.webkitRequestFullscreen; if (!f) return Promise.reject(new Error('no API'));
    try { const r=f.call(e,{navigationUI:'hide'}); return r&&r.then ? r : Promise.resolve(); } catch(err){ return Promise.reject(err); } },
  exit(){ const f=document.exitFullscreen||document.webkitExitFullscreen; try { const r=f&&f.call(document); if (r&&r.catch) r.catch(()=>{}); } catch(e){} },
};
function showMsg(html, buttons){

function toggleFullscreen(){

    showMsg(ios ? '<b>На iPhone браузер не даёт страницам включать полный экран.</b><br>Обходной путь: в Safari нажмите «Поделиться» → «На экран „Домой“» и открывайте страницу с иконки — она запустится без панелей браузера.'

    return; }

}

const pointers=new Map(); let dragMoved=false, pinch=null, downPos=null;
function hitTest(x,y){ let best=null, bd=1e9;
  for (const h of hits){ const d=Math.hypot(h.X-x,h.Y-y), lim=Math.max(h.r+6, 13); if (d<lim && d-h.r<bd){ bd=d-h.r; best=h.b; } }
  return best; }
function zoomBy(f, ax, ay){
  const base = zoomT!=null ? zoomT : cam.l;
  zoomT = clamp(base+Math.log(f), LMIN(), LMAX);
  zoomAnchor = {x:ax, y:ay}; fly=null;
}
cv.addEventListener('wheel', e=>{ e.preventDefault(); const dy = e.deltaMode===1? e.deltaY*30 : e.deltaY; zoomBy(Math.exp(-dy*0.0016), e.clientX, e.clientY); }, {passive:false});
cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  dragMoved=false; downPos={x:e.clientX,y:e.clientY};
  if (pointers.size===2){ const [a,b]=[...pointers.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}; }
});
cv.addEventListener('pointermove', e=>{
  const p=pointers.get(e.pointerId);
  if (!p){ const h=hitTest(e.clientX,e.clientY); hoverId=h?h.id:null; cv.classList.toggle('hover',!!h); return; }
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if (pointers.size===2 && pinch){
    const [a,b]=[...pointers.values()], d=Math.hypot(a.x-b.x,a.y-b.y);
    zoomBy(d/pinch.d, (a.x+b.x)/2, (a.y+b.y)/2); pinch.d=d; dragMoved=true; return;
  }
  if (!dragMoved && Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y) > 4){ dragMoved=true; cv.classList.add('drag'); }
  if (dragMoved){ follow=null; fly=null; cam.x-=dx/S; cam.y+=dy/S; syncFollowBtn(); }
});
function endPtr(e){
  if (!pointers.has(e.pointerId)) return;

}

function openCmp(hl){

function cmpLayout(){
  let list=BODIES.filter(b=> b.type!=='star' && b.type!=='comet' && ((b.type==='planet'&&cmp.planets)||(b.type==='dwarf'&&cmp.dwarfs)||(b.type==='moon'&&cmp.moons)));

  const top=document.querySelector('.cmp-top').getBoundingClientRect().bottom+12, avH=CH-top-70, cyy=top+avH*0.46;

  let x=46; cmp.sunItem=null;
  if (cmp.sun){ const rs=696340*k, vis=Math.min(2*rs, Math.max(CW*0.22, 160)); cmp.sunItem={cx:x+vis-rs, r:rs, right:x+vis}; x=x+vis+44; }

/* ---------- sun dates per constellation (current year) ---------- */

/* ---------- rendering ---------- */
function path(arr, closed){

    const z=M[6]*arr[k]+M[7]*arr[k+1]+M[8]*arr[k+2]; if (z<ZC){ pen=false; continue; }

}

let limMag=6;

  if (key===lastKey) return; lastKey=key;
  const tzs=`UTC${c.tz>=0?'+':'−'}${nf(Math.abs(c.tz),1)}`;
  el('skyTime').innerHTML=`<span class="d1">${ds}, ${ts}</span><small>${V.mode==='horizon'?`${c.n.replace(/ \(.*\)/,'')} · местное время ${tzs}`:`время ${tzs} · планеты на эту дату`}</small>`;

    : 'Вся небесная сфера в экваториальных координатах. Перетаскивайте, чтобы повернуть; колёсико — масштаб.';

    day.style.display='block';
    day.innerHTML = (sunAlt>0?'☀ Солнце над горизонтом — днём звёзд не видно, они показаны бледно.':'Сумерки — видны только самые яркие звёзды.') + ' <button class="btn" id="skyGoNight">Показать ночь</button>';
    el('skyGoNight').onclick=goNight;

  V.fly={t0:performance.now(), dur:900, l0:V.lon, b0:V.lat, f0:V.fov, l1:V.lon+dl, b1:bb, f1:fov||V.fov};
}

}

  if (AR.calib){ sg.strokeStyle='rgba(255,210,130,.95)'; sg.lineWidth=1.5; sg.beginPath(); sg.arc(CX,CY,16,0,TAU);
    sg.moveTo(CX-30,CY); sg.lineTo(CX-8,CY); sg.moveTo(CX+8,CY); sg.lineTo(CX+30,CY); sg.moveTo(CX,CY-30); sg.lineTo(CX,CY-8); sg.moveTo(CX,CY+8); sg.lineTo(CX,CY+30); sg.stroke(); }
  if (performance.now()-AR.lastEvt>2500){ sg.fillStyle='rgba(255,180,150,.95)'; sg.font='600 13px Manrope, sans-serif'; sg.textAlign='center'; sg.fillText('Нет данных от датчиков ориентации', SW/2, SH/2); sg.textAlign='left'; }
}
function arStatus(){
  const v=AR.view, c=city();
  const where = AR.gps ? `GPS ${nf(c.lat,2)}°, ${nf(c.lon,2)}°` : c.n.replace(/ \(.*\)/,'');
  let dir=''; if (v){ const alt=Math.asin(clamp(v.c[2],-1,1))/DEG; dir=` · смотрите на ${azName(azOf(v.c))} (${nf(azOf(v.c),0)}°), ${nf(Math.round(alt)||0,0)}° над горизонтом`; }
  el('arState').innerHTML = `${where} · ${AR.compass}${AR.yawOff?` · поправка ${AR.yawOff>0?'+':''}${nf(AR.yawOff,1)}°`:''}<small>${dir.replace(/^ · /,'')}</small>`;
  el('arFovLbl').textContent=`угол камеры ${nf(AR.fov,0)}°`;
}
function arMsg(html, buttons){ showMsg(html, buttons); }
const CAM_ERR = {
  PolicyBlocked: 'заблокирована средой просмотра: страница открыта внутри другого окна (например, в окне Claude), которое не пускает её к камере',
  NotAllowedError: 'доступ запрещён — разрешите камеру для этого сайта в настройках браузера (значок замка/«Aa» у адреса)',
  SecurityError: 'запрещена политикой безопасности страницы',
  NotFoundError: 'камера не найдена',
  OverconstrainedError: 'задняя камера не найдена',
  NotReadableError: 'камера занята другим приложением или недоступна системе',
  AbortError: 'камера не запустилась',
  NoAPI: 'браузер не даёт доступ к камере (или страница открыта не по https)',
};
const camErrText = e => CAM_ERR[e && e.name] || ((e && (e.name+': '+e.message)) || 'неизвестная ошибка');
async function openCamera(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('no getUserMedia'),{name:'NoAPI'});
  if (policyBlocks('camera')) throw Object.assign(new Error('permissions policy'),{name:'PolicyBlocked'});
  const tries=[{video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}}, audio:false},
               {video:{facingMode:'environment'}, audio:false}, {video:true, audio:false}];
  let last;
  for (const c of tries){
    try { return await navigator.mediaDevices.getUserMedia(c); }
    catch(e){ last=e; if (e.name==='NotAllowedError' || e.name==='SecurityError') break; }
  }
  throw last;
}
async function camOn(){
  AR.camErr=null;
  try { AR.stream=await openCamera(); const vd=el('arVideo'); vd.srcObject=AR.stream; await vd.play().catch(()=>{}); AR.cam=true; }
  catch(e){ AR.cam=false; AR.camErr=e; }
  el('arCamBtn').classList.toggle('on',AR.cam); camState();
}
function camOff(){ if (AR.stream) AR.stream.getTracks().forEach(t=>t.stop()); AR.stream=null; el('arVideo').srcObject=null; AR.cam=false; el('arCamBtn').classList.remove('on'); camState(); }
function camState(){
  const box=el('arCamState');
  if (!AR.on || AR.cam || !AR.camErr){ box.innerHTML=''; return; }
  box.innerHTML=`<div>📷 Камера: ${camErrText(AR.camErr)}</div><div class="cs-row"><button class="btn" id="arCamRetry">Повторить</button><button class="btn" id="arCamDiag">Подробнее</button></div>`;
  el('arCamRetry').onclick=camOn; el('arCamDiag').onclick=showDiag;
}
async function showDiag(){
  const yes=v=>v?'<span class="ok">да</span>':'<span class="bad">нет</span>';
  const pol=f=>{ const pp=document.permissionsPolicy||document.featurePolicy; if (!pp||!pp.allowsFeature) return 'не определить'; try { return pp.allowsFeature(f)?'<span class="ok">разрешено</span>':'<span class="bad">запрещено</span>'; } catch(e){ return 'не определить'; } };
  const perm=async n=>{ try { const r=await navigator.permissions.query({name:n}); return r.state==='granted'?'<span class="ok">разрешено</span>':r.state==='denied'?'<span class="bad">запрещено</span>':'спросит'; } catch(e){ return 'не определить'; } };
  const rows=[
    ['Страница по https (защищённый контекст)', yes(window.isSecureContext)],
    ['Открыта внутри другого окна', inFrame?'<span class="bad">да</span>':'<span class="ok">нет</span>'],
    ['Доступ к камере (API)', yes(!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))],
    ['Политика окна: камера', pol('camera')], ['Политика окна: гироскоп', pol('gyroscope')], ['Политика окна: акселерометр', pol('accelerometer')],
    ['Политика окна: магнитометр', pol('magnetometer')], ['Политика окна: геолокация', pol('geolocation')], ['Политика окна: полный экран', pol('fullscreen')],
    ['Разрешение браузера: камера', await perm('camera')], ['Разрешение браузера: геолокация', await perm('geolocation')],
    ['Датчики ориентации (API)', yes('DeviceOrientationEvent' in window)],
    ['Запрос разрешения датчиков (iOS)', typeof (window.DeviceOrientationEvent||{}).requestPermission==='function'?'есть':'не нужен'],
    ['Событий ориентации получено', String(AR.evtCount||0)], ['Источник направления', AR.compass],
    ['Камера сейчас', AR.cam?'<span class="ok">работает</span>':(AR.camErr?'<span class="bad">'+camErrText(AR.camErr)+'</span>':'выключена')],
    ['Полный экран (API)', yes(FS.supported())],
    ['Браузер', navigator.userAgent.replace(/[<>]/g,'')],
  ];
  const txt=rows.map(r=>r[0]+': '+r[1].replace(/<[^>]+>/g,'')).join('\n');
  showMsg(`<b>Диагностика AR</b><table>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`,
    [['Скопировать', ()=>{ try { navigator.clipboard.writeText(txt).then(()=>{},()=>{}); } catch(e){} return false; }], ['Закрыть', null]]);
}
async function arStart(){
  AR.fsByAR=false;
  if (!FS.active() && FS.supported()){ FS.enter().then(()=>{ AR.fsByAR=true; }).catch(()=>{}); }   // must start inside the tap
  if (!window.isSecureContext){ arMsg('<b>Режим AR недоступен.</b><br>Камера и датчики работают только на страницах, открытых по защищённому адресу (https).'); return; }
  const sensorsBlocked = policyBlocks('gyroscope') || policyBlocks('accelerometer') || policyBlocks('magnetometer');
  if (sensorsBlocked || (inFrame && !('DeviceOrientationEvent' in window))){
    if (AR.fsByAR || FS.active()) FS.exit();
    arMsg(`<b>Здесь браузер не даёт странице доступ к датчикам${policyBlocks('camera')?' и камере':''}.</b><br>Так бывает внутри окна Claude: страница показывается во встроенной «песочнице». Откройте этот же HTML-файл как обычный сайт (по https) в браузере телефона — режим AR заработает.`,
      [['Диагностика', ()=>{ setTimeout(showDiag,0); }], ['Понятно', null]]); return; }
  // iOS 13+: explicit permission from a tap
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==='function'){
    try { const r=await DeviceOrientationEvent.requestPermission(); if (r!=='granted'){ arMsg('Без доступа к датчикам движения AR не работает. Разрешите его в запросе браузера.'); return; } }
    catch(e){ arMsg('Не удалось запросить доступ к датчикам движения: '+e.message); return; } }
  AR.on=true; AR.view=null; AR.iosOff=null; AR.hasAbsEvt=false; AR.lastEvt=0; AR.evtCount=0;
  try { if (navigator.wakeLock) AR.wake=await navigator.wakeLock.request('screen'); } catch(e){}
  AR.saved={mode:V.mode, sp:V.spIdx, pl:V.playing, mw:V.o.mw, grid:V.o.grid};
  if (V.mode!=='horizon') setMode('horizon');
  simD=jdNow()-J2000; V.spIdx=0; V.playing=true; V.o.grid=0; lastKey='';
  el('sky').classList.add('ar'); info.classList.remove('open'); V.sel=null;
  addEventListener('deviceorientationabsolute', onOrientation, true); addEventListener('deviceorientation', onOrientation, true);
  // camera: optional — without it the overlay still follows the phone, and the reason is shown on screen
  AR.cam=false; await camOn();
  // precise location (optional)
  if (navigator.geolocation && !policyBlocks('geolocation') && !AR.gps){
    navigator.geolocation.getCurrentPosition(pos=>{ setGps(pos.coords.latitude, pos.coords.longitude); }, ()=>{}, {enableHighAccuracy:false, timeout:10000, maximumAge:600000});
  }
  arStatus();
  setTimeout(()=>{ if (AR.on && !AR.lastEvt){ arStop(); arMsg('<b>Датчики ориентации не отвечают.</b><br>'+(inFrame?'Страница открыта внутри другого окна (например, окна Claude), которое может не передавать ей данные гироскопа и компаса. Откройте её как обычный сайт по https.':'Похоже, у этого устройства нет гироскопа и компаса (например, это компьютер) или браузер не дал к ним доступ.'),
    [['Диагностика', ()=>{ setTimeout(showDiag,0); }], ['Понятно', null]]); } }, 3000);
}
function arStop(){
  AR.on=false; AR.calib=false; el('sky').classList.remove('ar'); el('arCal').style.display='none';
  removeEventListener('deviceorientationabsolute', onOrientation, true); removeEventListener('deviceorientation', onOrientation, true);
  camOff(); AR.camErr=null; el('arCamState').innerHTML='';
  try { if (AR.wake){ AR.wake.release(); AR.wake=null; } } catch(e){}
  if (AR.fsByAR && FS.active()) FS.exit(); AR.fsByAR=false;
  if (AR.saved){ V.o.grid=AR.saved.grid; if (AR.saved.mode!==V.mode) setMode(AR.saved.mode); AR.saved=null; }
  if (AR.view){ V.lon=Math.atan2(AR.view.c[1],AR.view.c[0]); V.lat=clamp(Math.asin(clamp(AR.view.c[2],-1,1)),-60*DEG,89*DEG); }
  lastKey=''; skyAV=null;
}
function setGps(lat,lon){
  const tz=-new Date().getTimezoneOffset()/60;
  const i=CITIES.findIndex(c=>c.gps); const c={n:'Моё местоположение (GPS)', lat, lon, tz, gps:true};
  if (i>=0) CITIES[i]=c; else CITIES.unshift(c);
  fillCities(); V.city=CITIES.indexOf(c); el('skyCity').value=V.city; AR.gps={lat,lon}; lastKey=''; buildList(); arStatus();
}
function calibStart(){
  if (!AR.view) return;
  frameMat(); computeBodies(); AR.calib=true;
  const cand=[];
  for (const o of bodies){ if (o.b.id==='sun' || ['pluto','ceres','halley','uranus','neptune'].includes(o.b.id)) continue; const [alt]=altAz(o.v); if (alt>3) cand.push({t:o.b.name, v:o.v}); }
  for (let i=0;i<NS && cand.length<12;i++){ const n=NAMES[i]; if (!n||!n[0]||SMAG[i]>1.8) continue; const v=[SV[3*i],SV[3*i+1],SV[3*i+2]]; if (altAz(v)[0]>8) cand.push({t:n[0], v}); }
  const box=el('arCal');
  box.innerHTML=`<b>Точная настройка направления</b><div class="note">Наведите перекрестие в центре экрана на яркий объект и нажмите его название. Компас телефона показывает магнитный север и может ошибаться на десятки градусов — эта поправка сохранится.</div>
    <div class="chips" style="margin-top:8px">${cand.map((c,i)=>`<span class="chip" data-i="${i}">${c.t}</span>`).join('')||'<span class="note">Над горизонтом сейчас нет ярких объектов.</span>'}</div>
    <div class="ip-actions"><button class="btn" id="arCalReset">Сбросить поправку</button><button class="btn" id="arCalClose">Готово</button></div>`;
  box.style.display='block';
  box.querySelectorAll('[data-i]').forEach(ch=>ch.onclick=()=>{
    const obj=cand[+ch.dataset.i]; const f=fApply(obj.v); const azObj=azOf(f), azCam=azOf(AR.view.c);
    AR.yawOff=wrap180(AR.yawOff + wrap180(azObj-azCam)); AR.view=null; arSave(); arStatus();
    ch.classList.add('on'); ch.textContent='✓ '+obj.t;
  });
  el('arCalReset').onclick=()=>{ AR.yawOff=0; AR.view=null; arSave(); arStatus(); };
  el('arCalClose').onclick=()=>{ AR.calib=false; box.style.display='none'; };
}
el('arFab').onclick=()=>arStart();
el('arDiagBtn').onclick=showDiag;
el('arExit').onclick=()=>arStop();
el('arCalBtn').onclick=()=>{ if (AR.calib){ AR.calib=false; el('arCal').style.display='none'; } else calibStart(); };
el('arCamBtn').onclick=()=>{ if (AR.cam) camOff(); else camOn(); };
el('arFovMinus').onclick=()=>arSetFov(AR.fov-2); el('arFovPlus').onclick=()=>arSetFov(AR.fov+2);
setInterval(()=>{ if (AR.on) arStatus(); }, 500);

/* ---------- open / close ---------- */
function resizeSky(){ SW=innerWidth; SH=innerHeight; scv.width=SW*dpr; scv.height=SH*dpr; }
addEventListener('resize',()=>{ if (V.open) resizeSky(); });
window.openSky=function(target){
  if (!V.open){
    V.saved={playing, spIdx, dir};
    V.open=true; el('sky').classList.add('open'); resizeSky();
    document.querySelectorAll('#skyMode button').forEach(b=>b.classList.toggle('on',b.dataset.mode===V.mode));
    el('skyCity').value=V.city;
    if (!V.inited){ V.inited=true; simD=jdNow()-J2000; V.spIdx=0; V.playing=true;
      frameMat(); computeBodies(); if (altAz(sunEq)[0]>-8) goNight(); V.playing=V.playing; }
    computeBodies(); buildList(); lastKey='';
  }
  if (target){ frameMat(); computeBodies(); const o=bodies.find(x=>x.b===target); if (o){ select({k:'body',o},false); const [l,b]=frameLonLat(o.v); V.lon=l; V.lat=V.mode==='horizon'?clamp(b,-60*DEG,89*DEG):b; V.fov=Math.min(V.fov,90); } }
  else if (!V.sel){ V.lon=V.mode==='horizon'?(90-180)*DEG:V.lon; }
};
window.closeSky=function(){
  if (!V.open) return; if (AR.on) arStop(); V.open=false; el('sky').classList.remove('open'); tip.style.display='none';
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (V.saved){ playing=V.saved.playing; spIdx=V.saved.spIdx; dir=V.saved.dir; setSpeedLabel(); document.getElementById('play').textContent=playing?'❚❚':'▶'; }
  lastHud='';
};
function syncTabs(){ const sky=V.open; document.querySelectorAll('.an-tab').forEach(t=>{ const on=(t.dataset.sec==='sky')===sky; t.classList.toggle('on',on); t.setAttribute('aria-selected',on?'true':'false'); }); }
document.querySelectorAll('.an-tab').forEach(t=>t.onclick=()=>{
  if (t.dataset.sec==='sky'){ if (!V.open){ const b=selected; openSky(b && ((['star','planet','dwarf','comet'].includes(b.type) && b.id!=='earth') || b.id==='moon') ? b : null); } }
  else closeSky();
});
const _open=window.openSky, _close=window.closeSky;
window.openSky=function(t){ _open(t); syncTabs(); }; window.closeSky=function(){ _close(); syncTabs(); };
syncTabs();
window.skyFrame=function(dt){ skyAV=null; if (V.playing) simD+=SPD[V.spIdx][0]*dt; updatePositions(); render(); };
// initial look: south, 30° up
V.lon=(90-180)*DEG; V.lat=30*DEG;
})();
